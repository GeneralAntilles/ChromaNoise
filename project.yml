# Xcode project definition. ChromaNoise.xcodeproj is generated from this file:
#   brew install xcodegen && xcodegen
# Edit this, not the .xcodeproj, when adding targets or settings.
name: ChromaNoise
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.2"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    # Set your team here (or in Xcode → Signing & Capabilities) to run on device.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
packages:
  ChromaNoiseKit:
    path: Packages/ChromaNoiseKit
targets:
  ChromaNoise:
    type: application
    platform: iOS
    sources:
      - App
      - UI
      - Audio
    dependencies:
      - package: ChromaNoiseKit
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: ChromaNoise
        UIBackgroundModes: [audio]
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.ChromaNoise
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
schemes:
  ChromaNoise:
    build:
      targets:
        ChromaNoise: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: ChromaNoiseKit/ChromaNoiseKitTests
