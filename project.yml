# Xcode project definition. ChromaNoise.xcodeproj is generated from this file:
#   brew install xcodegen && xcodegen
# Edit this, not the .xcodeproj, when adding targets or settings.
name: ChromaNoise
options:
  bundleIdPrefix: com.talkabel
  deploymentTarget:
    iOS: "17.2"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    # Set here, not in Xcode's Signing UI — xcodegen overwrites the project.
    DEVELOPMENT_TEAM: 578G67F2NQ
    CODE_SIGN_STYLE: Automatic
packages:
  ChromaNoiseKit:
    path: Packages/ChromaNoiseKit
targets:
  ChromaNoise:
    type: application
    platform: iOS
    sources:
      - App
      - UI
      - Audio
    dependencies:
      - package: ChromaNoiseKit
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: ChromaNoise
        UIBackgroundModes: [audio]
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # iPad multitasking (Split View, Stage Manager) needs all four.
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.talkabel.ChromaNoise
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  # App Store screenshots only (tools/screenshots.sh); not part of CI.
  ChromaNoiseUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: ChromaNoise
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.talkabel.ChromaNoiseUITests
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ChromaNoise:
    build:
      targets:
        ChromaNoise: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: ChromaNoiseKit/ChromaNoiseKitTests
  Screenshots:
    build:
      targets:
        ChromaNoise: all
        ChromaNoiseUITests: [test]
    test:
      config: Debug
      targets:
        - ChromaNoiseUITests
