name: CI

on:
  push:
  pull_request:

jobs:
  reference:
    name: Python DSP reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy
      - run: python tools/reference_dsp.py

  kit:
    name: ChromaNoiseKit (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1-noble
    defaults:
      run:
        working-directory: Packages/ChromaNoiseKit
    steps:
      - uses: actions/checkout@v4
      - run: swift test -c release

  app:
    name: iOS app (Simulator build)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - run: >
          xcodebuild build
          -project ChromaNoise.xcodeproj
          -scheme ChromaNoise
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
